# Fork-only validation recipe. Never part of the upstream feature PR.
# The product checkout is the immutable published feature commit, not this QA branch.
name: Provider bridge regression QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      RUST_TEST_THREADS: "1"
      WGPU_BACKEND: vulkan
      EXPECTED_SOURCE_SHA: "81d4a8abf71d61208ebe019206b814f2f782e705"
      CARGO_CACHE_AUTO_CLEAN_FREQUENCY: "never"
      NEXTEST_TEST_THREADS: "1"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "81d4a8abf71d61208ebe019206b814f2f782e705"
          persist-credentials: false
      - name: Prepare runtime environment before tool setup
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 /tmp/acp-qa "$RUNNER_TEMP/provider-runtime" "$RUNNER_TEMP/provider-config" "$RUNNER_TEMP/provider-data" "$RUNNER_TEMP/provider-cache" "$RUNNER_TEMP/provider-evidence" "$RUNNER_TEMP/provider-native-target"
          {
            echo "TMPDIR=/tmp/acp-qa"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/provider-native-target"
            echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/provider-runtime"
            echo "XDG_CONFIG_HOME=$RUNNER_TEMP/provider-config"
            echo "XDG_DATA_HOME=$RUNNER_TEMP/provider-data"
            echo "XDG_CACHE_HOME=$RUNNER_TEMP/provider-cache"
            echo "EVIDENCE_DIR=$RUNNER_TEMP/provider-evidence"
            echo "CRAFT_PROVIDER_UI_FIXTURES=$RUNNER_TEMP/provider-evidence"
            echo "CRAFT_FONTS_DIR=$GITHUB_WORKSPACE/craft-fonts"
            echo "CRAFT_FONTS_REQUIRED=1"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: storytold/craft-fonts
          ref: "b076417b5880bd4154bd22f00695b1d28c6bea83"
          path: craft-fonts
          persist-credentials: false
      - name: Install existing native build prerequisites
        uses: storytold/craft-common-actions/actions/install-apt-packages@44a7db40b1a3e99eed02c88f89f38cdd6cfffe81
        with:
          packages: "pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers libgl1-mesa-dev libvulkan1 libgtk-3-dev"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: "1.99.1"
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - name: Prepare isolated native runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          install -d -m 700 "$TMPDIR" "$XDG_RUNTIME_DIR" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_CACHE_HOME" "$EVIDENCE_DIR"
          mkdir -p qa-output artifacts
      - name: "Format before compilation"
        shell: bash
        run: |
          set -euo pipefail
          timeout 5m cargo fmt --all -- --check
      - name: "Clippy of all affected native targets"
        shell: bash
        run: |
          set -euo pipefail
          timeout 55m cargo clippy --locked -p wordcraft-ui-egui -p wordcraft-web --all-targets --keep-going -j2 -- -D warnings
      - name: "Prove the account-switch regression fails without the reset"
        shell: bash
        run: |
          set -euo pipefail
          timeout 45m python3 - <<'PY'
          import os,pathlib,re,subprocess
          p=pathlib.Path('crates/ui-egui/src/file_providers.rs')
          original=p.read_bytes()
          text=original.decode('utf-8')
          start=text.index('pub fn disconnect(')
          end=text.index('\n    }',start)
          body=text[start:end]
          reset='        s.documents = Value::Null;'
          assert body.count(reset)==1, 'Expected one document-cache reset in disconnect'
          mutated=text[:start]+body.replace(reset,'',1)+text[end:]
          env=dict(os.environ,CARGO_TERM_COLOR='never')
          try:
              p.write_bytes(mutated.encode('utf-8'))
              result=subprocess.run(['cargo','test','--locked','-p','wordcraft-ui-egui','--lib','file_providers::tests::disconnect_clears_published_document_metadata_before_another_account_connects','-j2','--','--exact','--test-threads=1'],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,env=env,timeout=2400)
              (pathlib.Path(os.environ['EVIDENCE_DIR'])/'account-reset-negative.log').write_text(result.stdout)
              expected='test file_providers::tests::disconnect_clears_published_document_metadata_before_another_account_connects ... FAILED'
              assert result.returncode!=0 and expected in result.stdout, 'Negative control must fail in the actual regression, not compilation or a missing test: '+result.stdout[-10000:]
              print('Confirmed regression fails without the published disconnect reset: file_providers::tests::disconnect_clears_published_document_metadata_before_another_account_connects')
              print(result.stdout[-5000:])
          finally:
              p.write_bytes(original)
          assert p.read_bytes()==original
          subprocess.run(['git','diff','--exit-code','--','crates/ui-egui/src/file_providers.rs'],check=True)
          PY
      - name: "All affected native tests on restored published source"
        shell: bash
        run: |
          set -euo pipefail
          timeout 65m cargo test --locked -p wordcraft-ui-egui -p wordcraft-web --lib --bins --tests -j2 -- --test-threads=1
      - name: "Actual browser WASM package"
        shell: bash
        run: |
          set -euo pipefail
          timeout 40m cargo check --locked -p wordcraft-web --target wasm32-unknown-unknown -j2
      - name: Verify tested source identity
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, struct, subprocess
          expected = os.environ['EXPECTED_SOURCE_SHA']
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert actual == expected, (actual, expected)
          subprocess.run(['git', 'diff', '--exit-code'], check=True)
          out = pathlib.Path(os.environ['EVIDENCE_DIR'])
          fonts_sha = subprocess.check_output(['git','-C','craft-fonts','rev-parse','HEAD'],text=True).strip() if pathlib.Path('craft-fonts/.git').exists() else None
          assert fonts_sha == "b076417b5880bd4154bd22f00695b1d28c6bea83"
          rustc = subprocess.check_output(['rustc','-Vv'],text=True)
          files = []
          assert len(files) == 0
          proof = []
          for raw in files:
              source = pathlib.Path(os.path.expandvars(raw))
              data = source.read_bytes()
              assert data[:8] == bytes([137,80,78,71,13,10,26,10]) and len(data)>1000, str(source)
              width, height = struct.unpack('>II', data[16:24])
              assert width>=300 and height>=300, (width,height)
              target = out / source.name
              if source.resolve() != target.resolve(): shutil.copy2(source,target)
              proof.append(dict(file=target.name,width=width,height=height,bytes=len(data),sha256=hashlib.sha256(data).hexdigest()))
          provenance = dict(source_sha=actual,fonts_sha=fonts_sha,rustc=rustc,workflow_sha=os.environ.get('GITHUB_SHA'),run_id=os.environ.get('GITHUB_RUN_ID'),renderer='focused bridge regression validation; no new image capture',browser_backend_e2e=False,images=proof)
          (out / 'provenance.json').write_text(json.dumps(provenance,indent=2)+chr(10))
          print(json.dumps(provenance))
          PY
      - name: Upload tested source provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: provider-checks-wordcraft-81d4a8abf71d
          path: |
            ${{ runner.temp }}/provider-evidence/provenance.json
          if-no-files-found: error
          retention-days: 14
